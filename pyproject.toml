[project]
name = "lfs-shimmy"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "boto3 (>=1.43.125,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = "^4.67.12"
tox-current-env = "^0.0.17"
black = "^26.10.1"
ruff = "^0.17.4"
bandit = "^1.9.4"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
