name: Release
on: { push: { branches: [ main ] } }
jobs:
  setup-build:
    permissions:
      contents: read
    uses: infrabits/ci-generate-version/.github/workflows/from-git.yml@4d4d1ff05b04de3b334ce9f5d2f0896e864e0f6d # v1.9.0

  build-container:
    runs-on: ubuntu-latest
    needs: [setup-build]
    permissions:
      contents: read
      packages: write
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container
        uses: infrabits/ci-pack@23a29fee6d6f6d7ea571b87c786a6ad7fcd6e618 # v2.9.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}:${{ needs.setup-build.outputs.version }}
          runtime_release: ${{ needs.setup-build.outputs.version }}
          use_builder: upstream

  create-release:
    runs-on: ubuntu-latest
    needs: [setup-build, build-container]
    steps:
      - name: Create GitHub release
        uses: infrabits/ci-create-missing-release@73b7177537a8878ba996e3bf8ce447a784db05f2 # v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.setup-build.outputs.version }}
