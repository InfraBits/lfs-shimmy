name: Release
on: { push: { branches: [ main ] } }
jobs:
  setup-build:
    permissions:
      contents: read
    uses: infrabits/ci-generate-version/.github/workflows/from-git.yml@ed633d7ea32bb24ce7c172d226f1cafb5512842a # main

  build-container:
    runs-on: ubuntu-latest
    needs: [setup-build]
    permissions:
      contents: read
      packages: write
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container
        uses: infrabits/ci-pack@a509b1eb75984d9b4712498e98d937584dfffbd3 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}:${{ needs.setup-build.outputs.version }}
          runtime_release: ${{ needs.setup-build.outputs.version }}
          use_builder: upstream

  create-release:
    runs-on: ubuntu-latest
    needs: [setup-build, build-container]
    steps:
      - name: Create GitHub release
        uses: infrabits/ci-create-missing-release@28473a12792785aeaf0ad393cef6664653d32e61 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.setup-build.outputs.version }}
