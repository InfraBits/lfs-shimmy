name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@0cd25fb25787c04f19ffcbd98591c542baf4b8bc # v1.11.0

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@d82ddc1a7ec28bdfac53050f25a742800fe11584 # v1.7.0
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  execute-test:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@d82ddc1a7ec28bdfac53050f25a742800fe11584 # v1.7.0
    with:
      environments: ${{ needs.setup-build.outputs.test }}
      install_dependencies: true

  build-container:
    runs-on: ubuntu-latest
    needs: [setup-build, execute-lint, execute-test]
    permissions:
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container
        uses: infrabits/ci-pack@23a29fee6d6f6d7ea571b87c786a6ad7fcd6e618 # v2.9.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}:${{ github.sha }}
          use_builder: upstream
          publish_image: false
