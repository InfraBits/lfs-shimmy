name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: infrabits/ci-create-renovate-release@40a8503e8bab9c4c89f04af896ef8ddbcc7294cc # v1.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
