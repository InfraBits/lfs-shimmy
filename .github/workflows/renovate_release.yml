name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: infrabits/ci-create-renovate-release@272b5bb5362a4bfc382e2eb9467b9733df321cf7 # v1.9.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
