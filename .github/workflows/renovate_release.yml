name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: infrabits/ci-create-renovate-release@d3c3eafbb4447506c459bebfe4d48b688d5427ff # v1.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
