name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: infrabits/ci-create-renovate-release@ed054999ebde161aceb37090d8d83fcf7b111fe8 # v1.6.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
